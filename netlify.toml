# Static hosting only: the app's files. All data goes from the phone straight to each seller's own Google Sheet.

[build]
  command = "npm run build"
  publish = "dist/accounts-manager-app/browser"

[build.environment]
  NODE_VERSION = "24"

# Angular routes (/home, /sale, …) are handled in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and its manifest must never be cached, or app updates won't reach users.
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

# Netlify doesn't know these extensions; a wrong type + nosniff blocks PWA install.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/bridge/Code.gs"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
